{% extends 'base.html' %}{% block title %}Daily Teacher Report{% endblock %}{% block content %}<div class="container py-5"><div class="auth-card wide mt-5"><span class="eyebrow dark">COLLEGE • DAILY REPORT</span><h2>Teacher Daily Report</h2><p>Record attendance, today's topic, practical activities, skill gaps and tomorrow's plan.</p><form method="post" class="row g-3"><div class="col-md-6"><label>Teacher</label><input class="form-control" name="teacher_name" list="teacherList" placeholder="Type teacher name" required><datalist id="teacherList">{% for t in trainers %}<option value="{{t.name}}"></option>{% endfor %}</datalist></div><div class="col-md-6"><label>Date</label><input class="form-control" type="date" name="report_date" required></div><div class="col-md-6"><label>Course / Subject</label><input class="form-control" name="course_name" required></div><div class="col-md-6"><label>Batch</label><input class="form-control" name="batch_name" required></div><div class="col-md-8"><label>Topic Covered</label><input class="form-control" name="topic" required></div><div class="col-md-2"><label>Present</label><input class="form-control" type="number" min="0" name="attendance" required></div><div class="col-md-2"><label>Total</label><input class="form-control" type="number" min="0" name="total_students" required></div><div class="col-12"><label>Activities / Practical Work</label><textarea class="form-control" name="activities" rows="3"></textarea></div><div class="col-md-6"><label>Issues / Skill Gaps</label><textarea class="form-control" name="issues" rows="3"></textarea></div><div class="col-md-6"><label>Tomorrow's Plan</label><textarea class="form-control" name="next_plan" rows="3"></textarea></div><div class="col-12"><button class="btn btn-primary btn-lg">Submit Daily Report</button> <a class="btn btn-outline-secondary btn-lg" href="{{url_for('college_reports')}}">Review Reports</a></div></form></div></div>{% endblock %}
