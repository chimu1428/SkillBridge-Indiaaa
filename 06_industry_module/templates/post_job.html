{% extends 'base.html' %}{% block title %}Post Opportunity{% endblock %}{% block content %}<div class="container py-5"><div class="auth-card wide mt-5"><span class="eyebrow dark">INDUSTRY</span><h2>Post a job / internship</h2><form method="post" class="row g-3 mt-2"><div class="col-md-6"><label>Job Title</label><input class="form-control" name="title" required></div><div class="col-md-6"><label>Job Type</label><select class="form-select" name="job_type"><option>Full-time</option><option>Internship</option><option>Part-time</option></select></div><div class="col-md-6"><label>Required Skills</label><input class="form-control" name="skills" placeholder="Java, SQL, DBMS" required></div><div class="col-md-6"><label>Location</label><input class="form-control" name="location" value="Pune" required></div><div class="col-12"><label>Description</label><textarea class="form-control" name="description" rows="4" required></textarea></div><div class="col-12"><button class="btn btn-primary">Publish Opportunity</button></div><div class="row g-3 mt-1"><div class="col-md-6"><label>Duration</label><input class="form-control" name="duration" placeholder="e.g. 3-6 months / 0-2 years"></div><div class="col-md-6"><label>Salary / Stipend</label><input class="form-control" name="compensation" placeholder="e.g. ₹15,000/month"></div><div class="col-12"><label>Opportunity Image URL (optional)</label><input class="form-control" name="image" placeholder="https://..."></div></div></form></div></div>{% endblock %}
