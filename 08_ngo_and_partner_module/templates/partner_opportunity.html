{% extends 'base.html' %}{% block title %}{{heading}}{% endblock %}{% block content %}<div class="container py-5"><div class="auth-card wide mt-5"><span class="eyebrow dark">{{role_label|upper}}</span><h2>{{heading}}</h2><p class="muted">This opportunity will appear in Jobs & Internships for students.</p><form method="post" class="row g-3"><div class="col-md-6"><label>Job / Internship Title</label><input class="form-control" name="title" required></div><div class="col-md-6"><label>Job Type</label><select class="form-select" name="job_type"><option>Full-time</option><option>Internship</option><option>Part-time</option></select></div><div class="col-md-6"><label>Required Skills</label><input class="form-control" name="skills" placeholder="Java, SQL, Python" required></div><div class="col-md-6"><label>Location</label><input class="form-control" name="location" value="Pune" required></div><div class="col-md-6"><label>Duration</label><input class="form-control" name="duration" placeholder="3-6 months"></div><div class="col-md-6"><label>Salary / Stipend</label><input class="form-control" name="compensation" placeholder="As per role"></div><div class="col-12"><label>Description</label><textarea class="form-control" name="description" rows="4" required></textarea></div><div class="col-md-6"><label>Image URL (optional)</label><input class="form-control" name="image"></div><div class="col-12"><button class="btn btn-primary">Publish Opportunity</button></div></form></div></div>{% endblock %}
