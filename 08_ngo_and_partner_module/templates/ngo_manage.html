{% extends 'base.html' %}{% block title %}NGO Support{% endblock %}{% block content %}<div class="container py-5"><div class="auth-card wide mt-5"><span class="eyebrow dark">NGO SUPPORT</span><h2>Record funding / support</h2><form method="post" class="row g-3"><div class="col-md-6"><label>Program / Funding Title</label><input class="form-control" name="title" required></div><div class="col-md-6"><label>Amount</label><input class="form-control" type="number" step="0.01" name="amount" required></div><div class="col-md-6"><label>Source</label><input class="form-control" name="source" required></div><div class="col-md-6"><label>Status</label><select class="form-select" name="status"><option>Planned</option><option>Active</option><option>Completed</option></select></div><div class="col-12"><button class="btn btn-primary">Save Record</button></div></form></div><div class="cardx mt-4"><h4>Funding records</h4>{% for f in funds %}<div class="job-line"><div><b>{{f.title}}</b><p>₹{{f.amount}} • {{f.source}}</p></div><span>{{f.status}}</span></div>{% else %}<p class="muted">No funding records.</p>{% endfor %}</div></div>{% endblock %}
